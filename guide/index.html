<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="快速开始：选择 AI Coding 工具、目标模型和实际支持的配置方式，完成 Sheep AI Plus 接入。">
  <meta name="keywords" content="CyberSheep,快速开始,Codex,Claude Code,Sheep AI Plus,CC Switch">
  <meta name="author" content="CyberSheep">
  <meta name="theme-color" content="#f7fbfa">
  <meta property="og:title" content="快速开始 — CyberSheep 赛博小羊">
  <meta property="og:description" content="按工具、模型和配置方式选择经过验证的 AI Coding 教程。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CyberSheep">
  <title>快速开始 — CyberSheep 赛博小羊</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/guide.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🐑</text></svg>">
</head>
<body>
  <header class="site-header" id="siteHeader"></header>
  <main>
    <div class="section guide-hero guide-hero--catalog">
      <a class="guide-back" href="../index.html">← 返回首页</a>
      <span class="kicker">Quick Start</span>
      <h1>快速开始</h1>
      <p class="guide-sub">只需完成两个选择：先告诉我们你要使用的工具，再从第二步进入它实际支持的配置教程。</p>
      <div class="guide-flow-summary" aria-label="使用流程">
        <span><b>1</b> 选择工具</span>
        <i aria-hidden="true">→</i>
        <span><b>2</b> 选择配置路线</span>
        <i aria-hidden="true">→</i>
        <span class="is-outcome"><b>✓</b> 开始使用</span>
      </div>
    </div>

    <div class="section guide-workflow" role="group" aria-label="快速开始主流程">
      <section class="guide-stage guide-stage--tools" aria-labelledby="guide-tools-title">
        <header class="guide-catalog-head">
          <span class="guide-catalog-step">01</span>
          <div>
            <span class="guide-stage-label">第一步</span>
            <h2 id="guide-tools-title">你想使用哪个工具？</h2>
            <p>点击一个工具，第二步只会显示与它匹配的教程。</p>
          </div>
        </header>
        <div class="guide-tool-grid" id="guideToolGrid" aria-live="polite"></div>
      </section>

      <div class="guide-workflow-arrow" aria-hidden="true">→</div>

      <section class="guide-stage guide-stage--routes" id="guideRoutesStage" aria-labelledby="guideRouteTitle">
        <header class="guide-catalog-head">
          <span class="guide-catalog-step">02</span>
          <div>
            <span class="guide-stage-label">第二步</span>
            <h2 id="guideRouteTitle">选择配置路线</h2>
            <p id="guideRouteSummary">请先在第一步选择一个工具。</p>
          </div>
        </header>
        <div class="guide-selected-tool" id="guideSelectedTool" hidden></div>
        <div class="guide-route-groups" id="guideRouteGroups" aria-live="polite"></div>
      </section>
    </div>

    <section class="section guide-resource-zone" aria-labelledby="guide-support-title">
      <header class="guide-resource-head">
        <div>
          <span class="guide-resource-label">可选 · 独立资源</span>
          <h2 id="guide-support-title">辅助工具与专题指南</h2>
          <p>这里不是第三步。你可以在需要排查网络、生成配置或深入了解某项功能时单独使用。</p>
        </div>
        <span class="guide-resource-note">与上方主流程互不依赖</span>
      </header>
      <div class="guide-support-grid" id="guideSupportGrid"></div>
    </section>

    <section class="section guide-planned" aria-labelledby="guide-planned-title">
      <div class="section-card">
        <span class="kicker">内容路线图</span>
        <h2 id="guide-planned-title">接下来会加入</h2>
        <p class="card-desc">以下工具已经进入内容规划；教程经过验证后才会出现在正式工具列表。</p>
        <div class="guide-planned-list" id="guidePlannedTools"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="siteFooter"></footer>
  <script src="../assets/site-data.js"></script>
  <script src="../js/site.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/guide-catalog.js"></script>
</body>
</html>
