<!DOCTYPE html>
<!-- ============================================================
  嵌入型公告模板（TEMPLATE — 不会被发布，仅供复制使用）
  ============================================================
  适用场景：你有一份风格独立的自定义 HTML（自带样式/脚本），
  想作为公告发布，又不想破坏它的内容。

  使用方法：
  1. 复制本文件 → 改名为公告 slug，如 announcements/xxx.html
  2. 把你的 HTML 的「主体内容」（<body> 里的可见部分）粘贴到
     下面标有「把你的内容粘贴到这里」的位置
  3. 把你的 <style> 粘贴到下方 <style> 块中，并把每个选择器都
     加上 `.announce-embed` 前缀（作用域隔离，避免污染站点主题）
  4. 把你的 <script> 放到 </body> 前（标有「你的脚本放这里」）
  5. 在 index.html 的 .announce-list 里复制一条 .announce-item 指向本页

  注意：
  - 不要粘贴完整的 <html>/<head>/<body> 骨架，只要主体可见内容
  - 站点的主题切换、邮箱复制由 js/main.js 自动生效
  - 深色模式下嵌入区保持浅色卡片（由 .announce-embed 决定）
  ============================================================ -->
