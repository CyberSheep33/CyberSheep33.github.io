<!DOCTYPE html>
<!-- ============================================================
  富 HTML 公告模板（TEMPLATE — 不会被发布，仅供复制使用）
  ============================================================
  开始前必须阅读 docs/announcement-html-standard.md。

  使用方法：
  1. 复制本文件 → 改名为公告 slug，如 announcements/xxx.html
  2. 全局替换下方 `SLUG` 为真实 slug
  3. 把正文粘贴到下方 article
  4. 每个私有 CSS 选择器必须以 `.announcement-content--SLUG` 开头
  5. 把你的 <script> 放到 </body> 前（标有「你的脚本放这里」）
  6. 在 data/announcements.json 登记元数据并运行 build-site-data.py

  注意：
  - 不要粘贴完整的 <html>/<head>/<body> 骨架，只要主体可见内容
  - 站点的主题切换、邮箱复制由 js/main.js 自动生效
  - 必须支持浅色、深色、375px 和 reduced-motion
  ============================================================ -->
<html lang="zh-CN">

    */
  </style>

</head>
