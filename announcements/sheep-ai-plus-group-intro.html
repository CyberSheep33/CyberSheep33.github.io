    var tbody = document.getElementById('giRows')
    var chipsWrap = document.getElementById('giChips')
    var search = document.getElementById('giSearch')
    var count = document.getElementById('giCount')
    var currentCat = '全部'

    var cats = ['全部'].concat(Array.from(new Set(GROUPS.map(function (g) { return g.cat }))).sort())
    chipsWrap.innerHTML = cats.map(function (c) {
      return '<button class="gi-chip' + (c === '全部' ? ' active' : '') + '" type="button" data-cat="' + c.replace(/"/g, '&quot;') + '">' + c + '</button>'
    }).join('')
    chipsWrap.addEventListener('click', function (e) {
      var b = e.target.closest('.gi-chip'); if (!b) return
      currentCat = b.getAttribute('data-cat')
      Array.prototype.forEach.call(chipsWrap.querySelectorAll('.gi-chip'), function (x) { x.classList.toggle('active', x === b) })
      render()
    })

    function render() {
      var q = (search.value || '').trim().toLowerCase()
      var list = GROUPS.filter(function (g) {
        if (currentCat !== '全部' && g.cat !== currentCat) return false
        if (q) return (g.name + ' ' + g.cat + ' ' + g.desc).toLowerCase().indexOf(q) >= 0
        return true
      })
      count.textContent = '共 ' + list.length + ' 个分组'
      tbody.innerHTML = list.map(function (g) {
        return '<tr>' +
          '<td><span class="gi-cat">' + g.cat + '</span></td>' +
          '<td class="gi-name">' + g.name + '</td>' +
          '<td class="gi-ratio">' + g.ratio + '</td>' +
          '<td class="gi-desc">' + g.desc + '</td>' +
        '</tr>'
      }).join('') || '<tr><td colspan="4" style="padding:24px;text-align:center;color:var(--gi-soft)">没有匹配的分组</td></tr>'
    }
    search.addEventListener('input', render)
    render()
  })()
