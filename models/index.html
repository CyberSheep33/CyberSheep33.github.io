<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CyberSheep 模型广场：按品牌、分组、类型、标签筛选 Sheep AI Plus 全部模型，点击查看各分组最终价格、调用端点等详情。">
  <meta name="keywords" content="模型广场,Sheep AI Plus,模型价格,分组,AI模型,CyberSheep">
  <meta name="author" content="CyberSheep">
  <meta name="theme-color" content="#f7fbfa">

  <meta property="og:title" content="模型广场 — CyberSheep 赛博小羊">
  <meta property="og:description" content="筛选 Sheep AI Plus 全部模型，查看各分组最终价格与调用端点。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CyberSheep">

  <title>模型广场 — CyberSheep 赛博小羊</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/models.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🐑</text></svg>">
</head>
<body>
  <header class="site-header" id="siteHeader"></header>

  <main>
    <div class="section models-wrap">
      <div class="models-toolbar">
        <div class="models-toolbar-top">
          <div class="models-search-wrap">
            <input class="models-search" id="modelSearch" type="search" placeholder="搜索模型名称 / 描述 / 标签" autocomplete="off" aria-label="搜索模型">
            <span class="models-search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
            </span>
          </div>
          <button class="models-filter-btn" id="filterBtn" type="button" aria-controls="filterLayer" aria-label="打开筛选">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
            <span>筛选</span>
          </button>
          <div class="models-sort-wrap">
            <button class="models-sort" id="sortBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="sortLabel">默认排序</span>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="sort-menu" id="sortMenu" role="listbox" hidden>
              <button type="button" role="option" data-sort="default">默认排序</button>
              <button type="button" role="option" data-sort="price-asc">价格从低到高</button>
              <button type="button" role="option" data-sort="price-desc">价格从高到低</button>
            </div>
          </div>
        </div>
        <div class="models-toolbar-bottom">
          <div class="models-meta">
            <span class="models-count" id="modelCount">加载中…</span>
            <span class="models-source" id="modelSource">数据：—</span>
          </div>
          <div class="models-layout-switch" id="layoutSwitch" role="group" aria-label="切换布局">
            <button type="button" data-layout="detail">详细</button>
            <button type="button" data-layout="compact">紧凑</button>
          </div>
        </div>
        <div class="models-active-filters" id="activeFilters"></div>
      </div>

      <div class="model-grid" id="modelGrid" aria-live="polite">
        <!-- 由 js/models.js 渲染 -->
      </div>

      <p class="models-note">
        💡 价格为估算的最终价格（基础价 × 分组倍率，含输入 / 输出 / 缓存命中 / 缓存创建），具体以 Sheep AI Plus 平台实际扣费为准。
        数据为静态快照，随站点定期更新；想了解分组怎么选更划算？看 <a href="../announcements/sheep-ai-plus-group-guide.html">分组选择指南</a>；想按类别速查全部分组的倍率与用途？看 <a href="../announcements/sheep-ai-plus-group-intro.html">分组介绍速查</a>。
      </p>
    </div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <!-- 浮动筛选弹窗 -->
  <div class="filter-layer" id="filterLayer" hidden>
    <div class="filter-backdrop" id="filterBackdrop"></div>
    <div class="filter-panel" role="dialog" aria-modal="true" aria-label="模型筛选">
      <div class="filter-panel-head">
        <strong>筛选模型</strong>
        <button class="filter-close" id="filterClose" type="button" aria-label="关闭筛选">×</button>
      </div>
      <div class="filter-active" id="filterActive"></div>
      <div class="filter-panel-body">
        <div class="sidebar-accordion" id="sidebarAccordion">
          <button class="sidebar-acc-head" type="button" data-acc="brand" aria-expanded="false">
            <span>按模型品牌筛选</span><span class="acc-caret" aria-hidden="true">▾</span>
          </button>
          <div class="sidebar-acc-body" id="acc-brand"></div>

          <button class="sidebar-acc-head" type="button" data-acc="group" aria-expanded="false">
            <span>按令牌分组筛选</span><span class="acc-caret" aria-hidden="true">▾</span>
          </button>
          <div class="sidebar-acc-body" id="acc-group">
            <input class="sidebar-search" id="sidebarGroupSearch" type="search" placeholder="搜索分组…" aria-label="搜索分组">
            <div id="sidebarGroup"></div>
          </div>

          <button class="sidebar-acc-head" type="button" data-acc="type" aria-expanded="false">
            <span>按模型类型筛选</span><span class="acc-caret" aria-hidden="true">▾</span>
          </button>
          <div class="sidebar-acc-body" id="acc-type"></div>

          <button class="sidebar-acc-head" type="button" data-acc="tag" aria-expanded="false">
            <span>按功能标签筛选</span><span class="acc-caret" aria-hidden="true">▾</span>
          </button>
          <div class="sidebar-acc-body" id="acc-tag">
            <input class="sidebar-search" id="sidebarTagSearch" type="search" placeholder="搜索标签…" aria-label="搜索标签">
            <div class="sidebar-list sidebar-list--scroll" id="sidebarTag"></div>
          </div>
        </div>
      </div>
      <div class="filter-panel-foot">
        <button class="btn btn-secondary sidebar-clear" id="sidebarClear" type="button">重置筛选</button>
      </div>
    </div>
  </div>

  <!-- 右侧详情侧页 -->
  <div class="model-drawer" id="modelDrawer" hidden>
    <div class="model-drawer-backdrop" id="drawerBackdrop"></div>
    <div class="model-drawer-panel" role="dialog" aria-modal="true" aria-label="模型详情">
      <button class="model-drawer-close" id="drawerClose" type="button" aria-label="关闭详情">×</button>
      <div class="model-drawer-content" id="drawerContent"></div>
    </div>
  </div>

  <script src="../js/site.js"></script>
  <script src="../js/main.js"></script>
  <script src="../assets/models-data.js"></script>
  <script src="../js/models.js"></script>
</body>
</html>
